<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sb-gradient-1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sb-gradient-2" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="sb-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Glow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sb-gradient-1)" />
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Modern Geometric SkillBridge 'S-Bridge' Glyph -->
  <!-- Top Bridge Arc -->
  <path d="M12 28C12 20.268 18.268 14 26 14C31.5 14 36 17.5 36 21C36 24 33 26 28 26" stroke="url(#sb-gradient-2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bottom Bridge Arc -->
  <path d="M36 20C36 27.732 29.732 34 22 34C16.5 34 12 30.5 12 27C12 24 15 22 20 22" stroke="url(#sb-gradient-2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Bridge Cables / Connection Nodes -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF" />
  <path d="M20 16.5L20 20M28 28L28 31.5" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" />
</svg>
